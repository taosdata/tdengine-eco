name: Build and Run TD-Spark Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Install Spark
        run: |
          wget https://archive.apache.org/dist/spark/spark-3.3.2/spark-3.3.2-bin-hadoop3-scala2.13.tgz
          tar zxf spark-3.3.2-bin-hadoop3-scala2.13.tgz -C ./

      - name: Start TDengine
        run: |
          docker run -d --name tdengine -p 6030:6030 -p 6041:6041 tdengine/tdengine:latest
          echo "Waiting for TDengine (taosd + taosAdapter) to become ready..."
          for i in $(seq 1 90); do
            code=$(curl -s -u root:taosdata -d "show databases" \
              http://127.0.0.1:6041/rest/sql 2>/dev/null | grep -o '"code":[0-9]*' | cut -d: -f2) || true
            if [ "$code" = "0" ]; then
              echo "TDengine is ready"
              exit 0
            fi
            sleep 2
          done
          echo "TDengine did not become ready in time"
          docker logs tdengine
          exit 1

      - name: Build the project
        run: |
          cd  spark
          mvn clean package

      - name: Run the project
        run: |
          export SPARK_HOME=./spark-3.3.2-bin-hadoop3-scala2.13
          export PATH=$PATH:$SPARK_HOME/bin:$SPARK_HOME/sbin
          rm -f  test.out
          spark-submit --master local --name testSpark \
            --conf spark.driver.userClassPathFirst=true \
            --conf spark.executor.userClassPathFirst=true \
            --class com.taosdata.java.SparkTest spark/target/testSpark-2.0-dist.jar >> test.out
          cat test.out
          strings_to_check=("test read successfully!" "test write successfully!" "test subscribe successfully!" "test analysis data successfully!")
          missing=false
          for str in "${strings_to_check[@]}"; do
            if ! cat test.out | grep -q "$str"; then
              echo "Output does not contain the string: $str"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          else
            echo "Output contains all specified strings."
            echo "test spark with TDengine read|write|subscribe passed."
          fi

      - name: Show TDengine logs on failure
        if: failure()
        run: docker logs tdengine | tail -100